<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | PeñaTec Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-sm p-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">PeñaTec Store</h1>

        <a href="index.html" class="text-gray-600 hover:text-black transition">
            Volver al inicio
        </a>
    </nav>

    <!-- TÍTULO -->
    <section class="py-16 text-center">
        <h2 class="text-4xl font-bold mb-4">
            Nuestro Catálogo
        </h2>

        <p class="text-gray-500">
            Equipos disponibles para entrega inmediata
        </p>
    </section>

    <!-- PRODUCTOS -->
    <section class="max-w-6xl mx-auto px-6 pb-20">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">

            <!-- PRODUCTO 1 -->
            <div class="bg-white p-6 rounded-3xl shadow hover:shadow-xl transition">

                <img 
                    src="Iphone 16 pro max.jpeg"
                    alt="iPhone 16 Pro Max"
                    class="rounded-2xl mb-4 w-full h-56 object-cover"
                >

                <h3 class="text-lg font-semibold">
                    iPhone 16 Pro Max
                </h3>

                <p class="text-gray-500 mb-2">
                    256 Gigas - Seminuevo
                </p>

                <p class="text-gray-500 mb-2">
                    Color Dorado
                </p>

                <p class="text-gray-500 mb-2">
                    Batería 90%
                </p>

                <p class="font-bold text-black mb-4">
                    $3.350.000
                </p>

                <a 
                    href="https://wa.me/573137632498?text=Hola%20me%20interesa%20el%20iPhone%2016%20Pro%20Max%20Dorado"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="inline-block bg-black text-white px-4 py-2 rounded-full text-sm hover:bg-gray-800 transition"
                >
                    Cotizar
                </a>

            </div>


            <!-- PRODUCTO 2 -->
            <div class="bg-white p-6 rounded-3xl shadow hover:shadow-xl transition">

                <img 
                    src="Tecno pova curve 2 5G.jpeg"
                    alt="Tecno Pova Curve 2 5G"
                    class="rounded-2xl mb-4 w-full h-56 object-cover"
                >

                <h3 class="text-lg font-semibold">
                    Tecno Pova Curve 2 5G
                </h3>

                <p class="text-gray-500 mb-2">
                    256 Gigas - 8+4 RAM
                </p>

                <p class="text-gray-500 mb-2">
                    Pantalla 2K 144Hz
                </p>

                <p class="text-gray-500 mb-2">
                    Batería 8000 mAh
                </p>

                <p class="font-bold text-black mb-4">
                    $580.000
                </p>

                <a 
                    href="https://wa.me/573137632498?text=Hola%20me%20interesa%20el%20Tecno%20Pova%20Curve%202%205G"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="inline-block bg-black text-white px-4 py-2 rounded-full text-sm hover:bg-gray-800 transition"
                >
                    Cotizar
                </a>

            </div>

        </div>

    </section>

</body>
</html>
